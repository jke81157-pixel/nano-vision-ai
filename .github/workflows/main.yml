name: Extract and Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP and fix directory structure
        run: |
          unzip -o "nano-vision-ai (3).zip" -d temp_extract
          shopt -s dotglob
          cp -rn temp_extract/*/* . || cp -rn temp_extract/* .
          rm -rf temp_extract "nano-vision-ai (3).zip"
          
          # إرجاع مجلد gradle لمكانه الصحيح إن وجد بالداخل
          if [ -d "nano-vision-ai/gradle" ]; then cp -r nano-vision-ai/gradle . ; fi
          if [ -d "app/gradle" ]; then cp -r app/gradle . ; fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
